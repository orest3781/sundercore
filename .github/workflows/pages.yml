name: Publish SunderCore
on:
  push:
    branches: [main]
    paths: ['site/**', 'tools/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refresh optional armory artwork
        run: python3 tools/refresh_armory.py
      - name: Validate data pipeline and dashboard
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          node --check site/app.js
          node tools/test_views.cjs
          node tools/test_armory.cjs
          node tools/test_daily_views.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
